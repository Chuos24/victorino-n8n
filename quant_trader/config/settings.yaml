universe: [BTC-USD, ETH-USD, SOL-USD, SPY, QQQ]
timeframe: 1d
backtest_start: "2022-01-01"
max_position_pct: 0.02
max_drawdown_kill: 0.10
# Raised from 0.70 → 0.72 alongside the new `min_agreement_delta` and
# ATR-percentile filters. The narrower confidence band trades fewer but
# stronger setups.
signal_confidence_threshold: 0.72
paper_mode: true
seed: 42

# Risk model defaults
initial_capital: 100000
commission_rate: 0.001
slippage_rate: 0.0005
max_concurrent_positions: 5
risk_free_rate: 0.05

# Strategy parameters
stop_atr_mult: 1.5
take_profit_atr_mult: 2.5
# 48 hours of holding -> ~10 trading days on a daily timeframe.
max_holding_bars: 10

# Regime filter (200-EMA slope) — implemented and available, but disabled
# by default because per-symbol gating dropped n_trades below the 50-trade
# floor and didn't improve PF over `long_only=true` alone. Flip to `true`
# to gate entries by trend regime (works best with `long_only=true` and
# raising `regime_slope_threshold` to ~0.01).
regime_filter: false
regime_slope_threshold: 0.0

# Long-only mode: trade-log analysis on the baseline run showed shorts
# carry a negative edge (PF 0.67) while longs are profitable (PF 1.13),
# driven by the BTC/ETH/SOL bull trend in the test window. With this on
# the strategy ignores short signals.
long_only: true

# ATR(14) percentile band over a trailing 252-bar window. Only enter when
# the current ATR sits inside [atr_pct_low, atr_pct_high]. Very low ATR
# is whipsaw chop; very high ATR signals regime breaks where the model's
# directional call tends to misfire.
atr_pct_low: 0.30
atr_pct_high: 0.70

# Probability margin between LGBM's top class and the runner-up. Raises
# the bar for "the model is sure": near-tie predictions (e.g.
# 0.34/0.33/0.33 across DOWN/FLAT/UP) get filtered out even if the top
# class clears `signal_confidence_threshold`.
min_agreement_delta: 0.05

# Paper trader poll interval (seconds)
poll_interval: 60
